name: Native tabs release

on:
  push:
    tags: ['native-tabs-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created from the selected branch if missing)
        required: true
        type: string
      runner:
        description: Hosted macOS runner for the universal build
        default: macos-26-intel
        type: choice
        options:
          - macos-26-intel
          - macos-26

permissions:
  contents: read

concurrency:
  group: native-tabs-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'higorhgon/AeroSpace'
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate release tag
        id: version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^native-tabs-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected a tag such as native-tabs-v0.21.3-native-tabs.1" >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "${RELEASE_TAG#native-tabs-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify release source
        id: source
        run: |
          commit="$(git rev-parse HEAD)"
          tag_ref="refs/tags/$RELEASE_TAG"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag_commit="$(git ls-remote origin "$tag_ref" "$tag_ref^{}" |
              awk -v ref="$tag_ref" '$2 == ref { tag = $1 } $2 == ref "^{}" { peeled = $1 } END { print peeled ? peeled : tag }')"
            if [[ -n "$tag_commit" && "$tag_commit" != "$commit" ]]; then
              echo "Tag $RELEASE_TAG points to $tag_commit, not the selected commit $commit." >&2
              exit 1
            fi
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Xcode and Swift
        run: |
          ./.github/gh-actions-runner-xcode-select.sh
          brew install bash fish
          HOMEBREW_DISABLE_LOAD_FORMULA=1 brew update
          brew install swiftly
          swiftly init --skip-install --assume-yes
          swiftly install

      - name: Build universal app and CLI
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build-release.sh --build-version "$RELEASE_VERSION" --codesign-identity -
          cd .release
          zip="AeroSpace-v$RELEASE_VERSION.zip"
          dmg="AeroSpace-v$RELEASE_VERSION.dmg"
          shasum -a 256 "$zip" > "$zip.sha256"
          shasum -a 256 "$dmg" > "$dmg.sha256"

      - name: Show build logs on failure
        if: failure()
        run: |
          for log in .release/build-app.log .release/build-cli.log; do
            if [[ -f "$log" ]]; then cat "$log"; fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: aerospace-universal
          path: |
            .release/AeroSpace-v*.zip
            .release/AeroSpace-v*.zip.sha256
            .release/AeroSpace-v*.dmg
            .release/AeroSpace-v*.dmg.sha256
          if-no-files-found: error
          include-hidden-files: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aerospace-universal
          path: release

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
        working-directory: release
        run: |
          zip="AeroSpace-v$RELEASE_VERSION.zip"
          dmg="AeroSpace-v$RELEASE_VERSION.dmg"
          sha256sum --check "$zip.sha256" "$dmg.sha256"
          tag_ref="refs/tags/$RELEASE_TAG"
          tag_commit() {
            git ls-remote "https://github.com/$GH_REPO.git" "$tag_ref" "$tag_ref^{}" |
              awk -v ref="$tag_ref" '$2 == ref { tag = $1 } $2 == ref "^{}" { peeled = $1 } END { print peeled ? peeled : tag }'
          }
          existing_commit="$(tag_commit)"
          if [[ -z "$existing_commit" && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh api "repos/$GH_REPO/git/refs" --method POST -f "ref=$tag_ref" -f "sha=$BUILD_COMMIT" --silent
            existing_commit="$BUILD_COMMIT"
          fi
          if [[ "$existing_commit" != "$BUILD_COMMIT" ]]; then
            echo "Tag $RELEASE_TAG does not identify the commit that was built." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$dmg" "$dmg.sha256" "$zip" "$zip.sha256" \
            --verify-tag --prerelease --title "AeroSpace $RELEASE_VERSION" \
            --notes "Universal macOS build (Intel and Apple Silicon) of the native-tabs fork. The DMG supports drag-and-drop installation, and the ZIP remains available for package managers. Both include AeroSpace.app and the aerospace CLI. The binaries are ad-hoc signed and not notarized."
